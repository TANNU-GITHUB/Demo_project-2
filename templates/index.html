<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniStore - Hardware & Accessories</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container nav-bar">
            <h1>MiniStore</h1>
            <nav>
                <a href="/">Products</a>
                <a href="/analytics" id="analytics-link">Store Analytics</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>Available Inventory</h2>
        <div id="product-grid" class="product-grid">
            {% for p in products %}
            <div class="product-card" data-id="{{ p.id }}">
                <h3>{{ p.name }}</h3>
                <p class="price">${{ "%.2f"|format(p.price) }}</p>
                <p class="stock">In Stock: <span id="stock-{{ p.id }}">{{ p.stock }}</span></p>
                <div class="order-action">
                    <input type="number" id="qty-{{ p.id }}" value="1" min="1" max="{{ p.stock }}" class="qty-input">
                    <button onclick="handleQuickOrder({{ p.id }})" class="btn-buy">Buy Now</button>
                </div>
            </div>
            {% endfor %}
        </div>

        <section class="checkout-section">
            <h3>Quick Order Summary</h3>
            <div class="form-row">
                <input type="text" id="discount-code" placeholder="Discount code (e.g. DISCOUNT10)">
                <button onclick="submitCheckout()" class="btn-primary" id="btn-checkout">Checkout</button>
            </div>
            <div id="order-result" class="result-box"></div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
